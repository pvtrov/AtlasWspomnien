services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitsi-backend
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
      PYTHONUNBUFFERED: "1"
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
      UV_INDEX: ${UV_INDEX:-https://pypi.org/simple}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitsi-frontend
    working_dir: /app
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: aitsi-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitsi}
      POSTGRES_USER: ${POSTGRES_USER:-aitsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitsi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitsi} -d ${POSTGRES_DB:-aitsi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
